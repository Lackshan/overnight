# Overnight: who can see what.
#
# Every gated part of the app has a key under `features`. `plans` lists the
# plans that can see it. There are three plans:
#   anonymous  not signed in
#   free       signed in
#   pro        supporters: made the optional one-off payment
#
# The API strips anything the caller's plan can't see, so this file is the
# single source of truth. The UI reads GET /api/session to know what to show
# as locked and whether the next step is "Sign up" or "Go Pro".
# Restart the server after editing. Unknown keys or plans fail at startup.

plans:
  anonymous:
    name: Guest
  free:
    name: Free
  pro:
    name: Supporter
    price_label: "£2.49 one-off"
    checkout_mode: payment # "payment" (one-off) or "subscription"
    stripe_price_env: STRIPE_PRICE_PRO # env var holding the Stripe price ID

# Cheapest to most expensive. Used to work out the next plan to upsell.
upgrade_order: [anonymous, free, pro]

features:
  report.score:
    label: Night and day scores
    plans: [anonymous, free, pro]
  report.sections:
    label: Section scores for night and day
    plans: [anonymous, free, pro]
  report.details:
    label: Section details
    plans: [free, pro]
  report.timeline:
    label: Every hour of the night
    plans: [anonymous, free, pro]
  safety.breakdown:
    label: Crime by category
    plans: [anonymous, free, pro]
  compare:
    label: Compare postcodes side by side
    plans: [pro]
  map.aircraft:
    label: Live aircraft
    plans: [anonymous, free, pro]
  map.overflights:
    label: Flight paths by hour
    plans: [free, pro]
  map.crime:
    label: Crime map layer
    plans: [anonymous, free, pro]
  map.air:
    label: Air quality map layer
    plans: [anonymous, free, pro]
  map.transport:
    label: Stations map layer
    plans: [anonymous, free, pro]
  map.health:
    label: GPs, urgent care and A&E on the map
    plans: [anonymous, free, pro]
  live.feed:
    label: Happening nearby
    plans: [free, pro]

# Numeric limits per plan. 0 means unlimited. A plan missing from a limit
# gets 0 (unlimited), so list every plan you want to cap.
limits:
  report.lookups_per_day:
    anonymous: 10
    free: 30
    pro: 0
  live.feed_items:
    anonymous: 0
    free: 3
    pro: 20
  # Guests' recent searches stay in their browser; signed-in users' are saved
  # to their account, so they follow them across devices.
  recent.searches:
    anonymous: 5
    free: 10
    pro: 25
  # How many postcodes a supporter can compare side by side.
  compare.postcodes:
    anonymous: 0
    free: 0
    pro: 4
